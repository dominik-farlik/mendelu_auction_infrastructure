# Apache vhost pro Dobrotrh (dobrotrhonline.mendelu.cz).
#
# Apache na serveru drží doménu a HTTPS certifikát a všechno přeposílá na nginx
# v Dockeru (docker compose v ~/dobrotrh), který poslouchá jen na 127.0.0.1:8080.
#
# Instalace (ze složky s tímto repem na serveru):
#   sudo a2enmod ssl proxy proxy_http headers
#   sudo cp apache/dobrotrh.conf /etc/apache2/sites-available/dobrotrh.conf
#   sudo a2dissite 000-default && sudo a2ensite dobrotrh
#   sudo apache2ctl configtest && sudo systemctl restart apache2
#
# a2enmod ssl zapne i "Listen 443" (/etc/apache2/ports.conf).
#
# Websockety (živé příhozy na /ws/) přenáší mod_proxy_http přes upgrade=websocket (Apache 2.4.47+).

<VirtualHost *:80>
    ServerName dobrotrhonline.mendelu.cz

    Redirect permanent / https://dobrotrhonline.mendelu.cz/
</VirtualHost>

<VirtualHost *:443>
    ServerName dobrotrhonline.mendelu.cz

    SSLEngine on
    # Certifikát od CESNETu, který na server nahráli admini. Apache ho čte při startu jako root.
    # Při obnově (nová složka, např. 2027) stačí změnit cesty a: sudo systemctl reload apache2
    SSLCertificateFile      /root/certs/cesnet/2026/server.pem
    SSLCertificateKeyFile   /root/certs/cesnet/2026/serverkey.pem
    SSLCertificateChainFile /root/certs/cesnet/2026/chain.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    ProxyPreserveHost On
    # Backend podle toho pozná HTTPS (např. nastaví přihlašovací cookie jako Secure).
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8080/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/dobrotrh_error.log
    CustomLog ${APACHE_LOG_DIR}/dobrotrh_access.log combined
</VirtualHost>
