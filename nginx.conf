events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;

    # Před nginxem stojí Apache na hostiteli (doména, HTTPS certifikát) a posílá provoz
    # na 127.0.0.1:8080. Do kontejneru přichází z docker sítě, proto jí věříme hlavičku
    # X-Forwarded-For. Bere se z ní jen poslední adresa, tedy ta, kterou doplnil Apache
    # (skutečná IP návštěvníka). Co si klient podvrhne na začátek hlavičky, se ignoruje.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Schéma (https/http) nastavuje Apache. Bez něj (přímý přístup na 8080) platí schéma nginxu.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Docker DNS + proměnné v proxy_pass: nginx si IP kontejnerů dohledává znovu,
        # takže restart backendu/frontendu nezpůsobí 502 kvůli staré IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        set $frontend_upstream http://frontend:80;

        # $remote_addr je díky real_ip skutečná IP návštěvníka (rate limiting na backendu).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        location /api/ {
            proxy_pass $backend_upstream;
        }

        location /static/ {
            proxy_pass $backend_upstream;
        }

        location /ws/ {
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass $frontend_upstream;
        }
    }
}
