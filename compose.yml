version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - auction-network

  frontend:
    image: ghcr.io/dominik-farlik/mendelu_auction_frontend:latest
    restart: always
    networks:
      - auction-network

  migrate:
    image: ghcr.io/dominik-farlik/mendelu_auction_backend:latest
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auction-network
    restart: "no"

  backend:
    image: ghcr.io/dominik-farlik/mendelu_auction_backend:latest
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - auction-network

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction-network

volumes:
  postgres_data:

networks:
  auction-network:
    driver: bridge