# Logy kontejnerů s rotací, aby časem nezaplnily disk serveru.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  reverse-proxy:
    image: nginx:alpine
    restart: always
    # Jen lokálně: zvenku je dostupný pouze Apache (80/443), který sem přeposílá.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - auction-network
    logging: *default-logging

  frontend:
    image: ghcr.io/dominik-farlik/mendelu_auction_frontend:latest
    restart: always
    networks:
      - auction-network
    logging: *default-logging

  migrate:
    image: ghcr.io/dominik-farlik/mendelu_auction_backend:latest
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auction-network
    restart: "no"
    logging: *default-logging

  backend:
    image: ghcr.io/dominik-farlik/mendelu_auction_backend:latest
    restart: always
    env_file:
      - .env
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - auction-network
    logging: *default-logging

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction-network
    logging: *default-logging

volumes:
  postgres_data:
  uploads:

networks:
  auction-network:
    driver: bridge
